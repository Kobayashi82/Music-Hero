[project]
name = "music-hero-app"
version = "0.1.0"
description = "Overlay tipo Guitar Hero para el escritorio de Windows"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PySide6-Essentials>=6.8",
    "pygame-ce>=2.5",
    "winrt-runtime>=3.0",
    "winrt-Windows.Foundation>=3.0",
    "winrt-Windows.Foundation.Collections>=3.0",
    "winrt-Windows.Media.Control>=3.0",
    "hidapi>=0.15.0",
    "soundfile>=0.14.0",
    "sounddevice>=0.5.6",
    "numpy>=2.5.4",
    "pyaudiowpatch>=0.2.12.9",
    "soxr>=1.1.0",
]

[project.scripts]
play = "app.play:main"

[tool.uv]
environments = ["sys_platform == 'win32'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
